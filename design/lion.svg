    <radialGradient id="muzzleGrad" cx="0.5" cy="0.5" r="0.7" fx="0.4" fy="0.25">
      <stop offset="0" stop-color="#FFF9EC"/>
      <stop offset="1" stop-color="#F1DCB8"/>
