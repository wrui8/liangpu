name: liangpu

services:
  server:
    build: .
    image: liangpu:0.1.0
    container_name: liangpu
    restart: unless-stopped
    ports:
      - "7001:7001"
      - "7003:7003"
      # 官网下载页同时挂到 80：手机浏览器只输入 IP 也能打开（明文，无需信任内部 CA）
      - "80:7003"
    environment:
      PORT: "7001"
      HOST: "0.0.0.0"
      PUBLIC_PORT: "7003"
      PUBLIC_HOST: "0.0.0.0"
      # 从 .env 读取（见 .env.example）；不要把真实密钥写进本文件或提交到仓库
      JWT_SECRET: "${JWT_SECRET:?未设置 JWT_SECRET：请把 .env.example 复制为 .env 并填入随机值}"
      JWT_EXPIRES_IN: "7d"
      # 需求总分权重：自身评分占 70%，需求内成员表现分占 30%
      NEED_SELF_WEIGHT: "0.7"
      DATABASE_URL: "file:/app/data/liangpu.db"
      TLS_CERT: "/app/certs/server.crt"
      TLS_KEY: "/app/certs/server.key"
      DOWNLOAD_DIR: "/app/downloads"
      UPLOAD_DIR: "/app/data/uploads"
      TZ: "Asia/Shanghai"
    volumes:
      - ./docker-data:/app/data
      - ./docker-data/certs:/app/certs:ro
      - ./docker-data/downloads:/app/downloads:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "NODE_EXTRA_CA_CERTS=/app/certs/ca.pem node -e \"fetch('https://127.0.0.1:7001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
